plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vinh.livedub'
    compileSdk 35

    defaultConfig {
        applicationId 'com.vinh.livedub'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.mlkit:translate:17.0.3'
}
