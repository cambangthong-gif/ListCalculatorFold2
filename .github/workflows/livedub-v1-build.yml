name: Build LiveDub V1 APK

on:
  push:
    branches: [ livedub-apk-v1 ]
    paths:
      - 'LiveDubV1/**'
      - '.github/workflows/livedub-v1-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: LiveDubV1
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp LiveDubV1/app/build/outputs/apk/debug/app-debug.apk LiveDub-Viet-v0.2-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LiveDub-Viet-v0.2-debug
          path: LiveDub-Viet-v0.2-debug.apk
