name: RedMagic 8 Pro shoulder-volume APK
on:
  push:
    branches:
      - redmagic8-shoulder-volume
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        working-directory: redmagic-shoulder-volume
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: RedMagic8-ShoulderVolume-APK
          path: redmagic-shoulder-volume/app/build/outputs/apk/debug/app-debug.apk
