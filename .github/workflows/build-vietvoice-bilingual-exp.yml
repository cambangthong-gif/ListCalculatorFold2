          cat > app/src/main/java/com/cambangthong/vietvoicebilingual/AppPrefs.java <<'EOF'
          package com.cambangthong.vietvoicebilingual;

          import android.content.Context;
          import android.content.SharedPreferences;
          import java.io.File;

          final class AppPrefs {
              private static final String PREF = "vietvoice_bilingual";
              private static final String KEY_CONSENT = "consent";
              private AppPrefs() {}
              static SharedPreferences p(Context c) { return c.getSharedPreferences(PREF, Context.MODE_PRIVATE); }
              static boolean consent(Context c) { return p(c).getBoolean(KEY_CONSENT, false); }
              static void setConsent(Context c, boolean v) { p(c).edit().putBoolean(KEY_CONSENT, v).apply(); }
              static File ref(Context c) { return new File(c.getFilesDir(), "reference.wav"); }
          }
          EOF

          cat > app/src/main/java/com/cambangthong/vietvoicebilingual/WavRecorder.java <<'EOF'
          package com.cambangthong.vietvoicebilingual;

          import android.media.AudioFormat;
          import android.media.AudioRecord;
          import android.media.MediaRecorder;
          import java.io.*;
          import java.util.concurrent.atomic.AtomicBoolean;

          final class WavRecorder {
              private static final int SR = 16000;
              private final AtomicBoolean running = new AtomicBoolean(false);
              private AudioRecord recorder;
              private Thread thread;
              private File wav;

              boolean isRecording() { return running.get(); }

              void start(File out) throws IOException {
                  if (running.get()) return;
                  int min = AudioRecord.getMinBufferSize(SR, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT);
                  int buffer = Math.max(min * 2, 4096);
                  recorder = new AudioRecord(MediaRecorder.AudioSource.VOICE_RECOGNITION, SR,
                          AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT, buffer);
                  if (recorder.getState() != AudioRecord.STATE_INITIALIZED) throw new IOException("Không mở được microphone");
                  wav = out;
                  running.set(true);
                  recorder.startRecording();
                  thread = new Thread(() -> loop(buffer), "ref-recorder");
                  thread.start();
              }

              void stop() {
                  if (!running.getAndSet(false)) return;
                  try { recorder.stop(); } catch (Exception ignored) {}
                  try { thread.join(2000); } catch (Exception ignored) {}
                  try { recorder.release(); } catch (Exception ignored) {}
                  recorder = null;
              }

              private void loop(int bufferSize) {
                  File pcm = new File(wav.getParentFile(), "reference.pcm");
                  long bytes = 0;
                  try (FileOutputStream out = new FileOutputStream(pcm)) {
                      byte[] b = new byte[bufferSize];
                      while (running.get()) {
                          int n = recorder.read(b, 0, b.length);
                          if (n > 0) { out.write(b, 0, n); bytes += n; }
                      }
                  } catch (Exception ignored) {}
                  try { writeWav(pcm, wav, bytes); } catch (Exception ignored) {}
                  //noinspection ResultOfMethodCallIgnored
                  pcm.delete();
              }

              private static void writeWav(File pcm, File wav, long dataLen) throws IOException {
                  try (DataOutputStream o = new DataOutputStream(new FileOutputStream(wav));
                       FileInputStream in = new FileInputStream(pcm)) {
                      ascii(o, "RIFF"); le32(o, 36 + dataLen); ascii(o, "WAVE");
                      ascii(o, "fmt "); le32(o, 16); le16(o, 1); le16(o, 1);
                      le32(o, SR); le32(o, SR * 2L); le16(o, 2); le16(o, 16);
                      ascii(o, "data"); le32(o, dataLen);
                      byte[] buf = new byte[8192]; int n;
                      while ((n = in.read(buf)) > 0) o.write(buf, 0, n);
                  }
              }
              private static void ascii(DataOutputStream o, String s) throws IOException { o.writeBytes(s); }
              private static void le16(DataOutputStream o, long v) throws IOException {
                  o.writeByte((int)(v & 255)); o.writeByte((int)((v >> 8) & 255));
              }
              private static void le32(DataOutputStream o, long v) throws IOException {
                  o.writeByte((int)(v & 255)); o.writeByte((int)((v >> 8) & 255));
                  o.writeByte((int)((v >> 16) & 255)); o.writeByte((int)((v >> 24) & 255));
              }
          }
          EOF

          cat > app/src/main/java/com/cambangthong/vietvoicebilingual/WavData.java <<'EOF'
          package com.cambangthong.vietvoicebilingual;

          import java.io.IOException;
          import java.nio.ByteBuffer;
          import java.nio.ByteOrder;
          import java.util.Arrays;

          final class WavData {
              final int sampleRate, channels;
              final byte[] pcm16;
              WavData(int sr, int ch, byte[] pcm) { sampleRate = sr; channels = ch; pcm16 = pcm; }

              static WavData parse(byte[] wav) throws IOException {
                  if (wav.length < 44 || !tag(wav,0,"RIFF") || !tag(wav,8,"WAVE"))
                      throw new IOException("Audio trả về không phải WAV");
                  int pos = 12, audioFormat = 1, channels = 1, sampleRate = 48000, bits = 16;
                  int dataPos = -1, dataLen = -1;
                  while (pos + 8 <= wav.length) {
                      String id = new String(wav, pos, 4, java.nio.charset.StandardCharsets.US_ASCII);
                      int len = le32(wav, pos + 4);
                      int body = pos + 8;
                      if (body + len > wav.length) len = wav.length - body;
                      if ("fmt ".equals(id) && len >= 16) {
                          audioFormat = le16(wav, body);
                          channels = le16(wav, body + 2);
                          sampleRate = le32(wav, body + 4);
                          bits = le16(wav, body + 14);
                      } else if ("data".equals(id)) {
                          dataPos = body; dataLen = len; break;
                      }
                      pos = body + len + (len & 1);
                  }
                  if (dataPos < 0) throw new IOException("WAV không có data chunk");
                  byte[] raw = Arrays.copyOfRange(wav, dataPos, dataPos + dataLen);
                  if (audioFormat == 1 && bits == 16) return new WavData(sampleRate, channels, raw);
                  if (audioFormat == 3 && bits == 32) {
                      ByteBuffer in = ByteBuffer.wrap(raw).order(ByteOrder.LITTLE_ENDIAN);
                      ByteBuffer out = ByteBuffer.allocate((raw.length / 4) * 2).order(ByteOrder.LITTLE_ENDIAN);
                      while (in.remaining() >= 4) {
                          float f = Math.max(-1f, Math.min(1f, in.getFloat()));
                          out.putShort((short)Math.round(f * 32767f));
                      }
                      return new WavData(sampleRate, channels, out.array());
                  }
                  throw new IOException("WAV format chưa hỗ trợ: format=" + audioFormat + ", bits=" + bits);
              }

              private static boolean tag(byte[] b, int p, String s) {
                  if (p + 4 > b.length) return false;
                  for (int i=0;i<4;i++) if (b[p+i] != (byte)s.charAt(i)) return false;
                  return true;
              }
              private static int le16(byte[] b,int p){ return (b[p]&255)|((b[p+1]&255)<<8); }
              private static int le32(byte[] b,int p){ return (b[p]&255)|((b[p+1]&255)<<8)|((b[p+2]&255)<<16)|((b[p+3]&255)<<24); }
          }
          EOF

          cat > app/src/main/java/com/cambangthong/vietvoicebilingual/VieNeuSpaceClient.java <<'EOF'
          package com.cambangthong.vietvoicebilingual;

          import okhttp3.*;
          import org.json.*;
          import java.io.*;
          import java.net.URLEncoder;
          import java.nio.charset.StandardCharsets;
          import java.util.Iterator;
          import java.util.concurrent.TimeUnit;

          final class VieNeuSpaceClient {
              private static final String BASE = "https://pnnbao-ump-vieneu-tts-v3-turbo.hf.space";
              private final OkHttpClient http = new OkHttpClient.Builder()
                      .connectTimeout(35, TimeUnit.SECONDS)
                      .readTimeout(12, TimeUnit.MINUTES)
                      .writeTimeout(3, TimeUnit.MINUTES)
                      .callTimeout(15, TimeUnit.MINUTES)
                      .build();

              private String endpoint;
              private File cachedRefFile;
              private long cachedRefLength;
              private long cachedRefMtime;
              private JSONObject cachedRemoteRef;

              synchronized byte[] synthesize(String text, File ref) throws Exception {
                  if (text == null || text.trim().isEmpty()) throw new IOException("Văn bản trống");
                  JSONObject remoteRef = ensureUploaded(ref);
                  String ep = endpoint != null ? endpoint : discoverEndpoint();
                  endpoint = ep;

                  JSONArray data = new JSONArray()
                          .put(text.trim())
                          .put("Phạm Tuyên")
                          .put(remoteRef)
                          .put(0.8)
                          .put(25)
                          .put(0.95)
                          .put(1.2)
                          .put(300)
                          .put(256);

                  JSONObject req = new JSONObject().put("data", data);
                  Request call = jsonPost(BASE + "/gradio_api/call/" + ep, req);
                  String eventId;
                  try (Response r = http.newCall(call).execute()) {
                      if (!r.isSuccessful()) {
                          endpoint = discoverEndpoint();
                          try (Response r2 = http.newCall(jsonPost(BASE + "/gradio_api/call/" + endpoint, req)).execute()) {
                              if (!r2.isSuccessful()) throw new IOException("VieNeu call HTTP " + r2.code());
                              eventId = new JSONObject(requireBody(r2)).optString("event_id");
                          }
                      } else eventId = new JSONObject(requireBody(r)).optString("event_id");
                  }
                  if (eventId == null || eventId.isEmpty()) throw new IOException("VieNeu không trả event_id");

                  Request eventReq = new Request.Builder()
                          .url(BASE + "/gradio_api/call/" + endpoint + "/" + eventId)
                          .header("Accept", "text/event-stream")
                          .header("User-Agent", "VietVoice-Bilingual/0.2")
                          .build();
                  String sse;
                  try (Response r = http.newCall(eventReq).execute()) {
                      if (!r.isSuccessful()) throw new IOException("VieNeu queue HTTP " + r.code());
                      sse = requireBody(r);
                  }
                  JSONArray result = parseCompleteData(sse);
                  String audioUrl = findAudioUrl(result);
                  if (audioUrl == null) throw new IOException("VieNeu không trả file audio");
                  if (audioUrl.startsWith("/")) audioUrl = BASE + audioUrl;

                  Request audioReq = new Request.Builder().url(audioUrl)
                          .header("User-Agent", "VietVoice-Bilingual/0.2").build();
                  try (Response r = http.newCall(audioReq).execute()) {
                      if (!r.isSuccessful()) throw new IOException("Tải audio HTTP " + r.code());
                      ResponseBody body = r.body();
                      if (body == null) throw new IOException("Audio rỗng");
                      return body.bytes();
                  }
              }

              private synchronized JSONObject ensureUploaded(File ref) throws Exception {
                  if (ref == null || !ref.isFile() || ref.length() < 1000) throw new IOException("Chưa có mẫu giọng");
                  if (cachedRemoteRef != null && ref.equals(cachedRefFile) &&
                          ref.length() == cachedRefLength && ref.lastModified() == cachedRefMtime) return cachedRemoteRef;

                  RequestBody fileBody = RequestBody.create(ref, MediaType.parse("audio/wav"));
                  MultipartBody body = new MultipartBody.Builder().setType(MultipartBody.FORM)
                          .addFormDataPart("files", "reference.wav", fileBody).build();
                  Request request = new Request.Builder().url(BASE + "/gradio_api/upload")
                          .header("User-Agent", "VietVoice-Bilingual/0.2")
                          .post(body).build();

                  try (Response r = http.newCall(request).execute()) {
                      if (!r.isSuccessful()) throw new IOException("Upload mẫu giọng HTTP " + r.code());
                      JSONArray a = new JSONArray(requireBody(r));
                      if (a.length() == 0) throw new IOException("Upload không trả đường dẫn");
                      Object first = a.get(0);
                      JSONObject fd;
                      if (first instanceof JSONObject) {
                          fd = (JSONObject) first;
                          if (!fd.has("meta")) fd.put("meta", new JSONObject().put("_type", "gradio.FileData"));
                      } else {
                          String path = String.valueOf(first);
                          fd = new JSONObject()
                                  .put("path", path)
                                  .put("orig_name", "reference.wav")
                                  .put("size", ref.length())
                                  .put("mime_type", "audio/wav")
                                  .put("meta", new JSONObject().put("_type", "gradio.FileData"));
                      }
                      cachedRefFile = ref; cachedRefLength = ref.length(); cachedRefMtime = ref.lastModified();
                      cachedRemoteRef = fd;
                      return fd;
                  }
              }

              private String discoverEndpoint() {
                  for (String p : new String[]{"/gradio_api/info", "/info"}) {
                      try (Response r = http.newCall(new Request.Builder().url(BASE + p)
                              .header("User-Agent", "VietVoice-Bilingual/0.2").get().build()).execute()) {
                          if (!r.isSuccessful()) continue;
                          JSONObject root = new JSONObject(requireBody(r));
                          JSONObject named = root.optJSONObject("named_endpoints");
                          if (named == null) continue;
                          Iterator<String> it = named.keys();
                          String fallback = null;
                          while (it.hasNext()) {
                              String k = it.next();
                              String clean = k.startsWith("/") ? k.substring(1) : k;
                              if (fallback == null) fallback = clean;
                              if (clean.toLowerCase().contains("synthesize")) return clean;
                          }
                          if (fallback != null) return fallback;
                      } catch (Exception ignored) {}
                  }
                  return "synthesize";
              }

              private static JSONArray parseCompleteData(String sse) throws Exception {
                  String[] lines = sse.split("\\n");
                  String lastData = null;
                  String event = null;
                  for (String line : lines) {
                      if (line.startsWith("event:")) event = line.substring(6).trim();
                      if (line.startsWith("data:")) {
                          String d = line.substring(5).trim();
                          if ("error".equals(event)) throw new IOException("VieNeu Space báo lỗi: " + d);
                          lastData = d;
                          if ("complete".equals(event)) return new JSONArray(d);
                      }
                  }
                  if (lastData != null) return new JSONArray(lastData);
                  throw new IOException("Không đọc được kết quả từ hàng chờ VieNeu");
              }

              private static String findAudioUrl(Object node) throws JSONException {
                  if (node == null || node == JSONObject.NULL) return null;
                  if (node instanceof JSONObject) {
                      JSONObject o = (JSONObject) node;
                      String url = o.optString("url", null);
                      if (url != null && !url.isEmpty()) return url;
                      String path = o.optString("path", null);
                      if (path != null && (path.endsWith(".wav") || path.endsWith(".mp3") || path.endsWith(".flac"))) {
                          return BASE + "/gradio_api/file=" + URLEncoder.encode(path, StandardCharsets.UTF_8).replace("+", "%20");
                      }
                      Iterator<String> it = o.keys();
                      while (it.hasNext()) {
                          String v = findAudioUrl(o.opt(it.next()));
                          if (v != null) return v;
                      }
                  } else if (node instanceof JSONArray) {
                      JSONArray a = (JSONArray) node;
                      for (int i=0;i<a.length();i++) {
                          String v = findAudioUrl(a.opt(i));
                          if (v != null) return v;
                      }
                  } else if (node instanceof String) {
                      String s = (String)node;
                      if (s.startsWith("http") && (s.contains(".wav") || s.contains("file="))) return s;
                  }
                  return null;
              }

              private static Request jsonPost(String url, JSONObject o) {
                  return new Request.Builder().url(url)
                          .header("User-Agent", "VietVoice-Bilingual/0.2")
                          .post(RequestBody.create(o.toString(), MediaType.parse("application/json; charset=utf-8"))).build();
              }

              private static String requireBody(Response r) throws IOException {
                  ResponseBody b = r.body();
                  if (b == null) throw new IOException("HTTP body rỗng");
                  return b.string();
              }
          }
          EOF

          cat > app/src/main/java/com/cambangthong/vietvoicebilingual/VietVoiceBilingualService.java <<'EOF'
          package com.cambangthong.vietvoicebilingual;

          import android.media.AudioFormat;
          import android.speech.tts.SynthesisCallback;
          import android.speech.tts.SynthesisRequest;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.TextToSpeechService;
          import java.io.File;
          import java.util.Locale;
          import java.util.concurrent.atomic.AtomicBoolean;

          public class VietVoiceBilingualService extends TextToSpeechService {
              private VieNeuSpaceClient client;
              private final AtomicBoolean stopped = new AtomicBoolean(false);

              @Override public void onCreate() {
                  super.onCreate();
                  client = new VieNeuSpaceClient();
              }

              @Override protected String[] onGetLanguage() {
                  return new String[]{"vi", "VN", ""};
              }

              @Override protected int onIsLanguageAvailable(String lang, String country, String variant) {
                  if (lang == null) return TextToSpeech.LANG_NOT_SUPPORTED;
                  String l = lang.toLowerCase(Locale.ROOT);
                  if ("vi".equals(l) || "vie".equals(l) || "en".equals(l) || "eng".equals(l))
                      return TextToSpeech.LANG_AVAILABLE;
                  return TextToSpeech.LANG_NOT_SUPPORTED;
              }

              @Override protected int onLoadLanguage(String lang, String country, String variant) {
                  return onIsLanguageAvailable(lang, country, variant);
              }

              @Override protected void onStop() {
                  stopped.set(true);
              }

              @Override protected void onSynthesizeText(SynthesisRequest request, SynthesisCallback callback) {
                  stopped.set(false);
                  if (!AppPrefs.consent(this)) { callback.error(); return; }
                  File ref = AppPrefs.ref(this);
                  if (!ref.isFile()) { callback.error(); return; }
                  try {
                      byte[] wav = client.synthesize(request.getCharSequenceText().toString(), ref);
                      if (stopped.get()) { callback.error(); return; }
                      WavData data = WavData.parse(wav);
                      int channels = Math.max(1, Math.min(2, data.channels));
                      int ok = callback.start(data.sampleRate, AudioFormat.ENCODING_PCM_16BIT, channels);
                      if (ok != TextToSpeech.SUCCESS) { callback.error(); return; }
                      int max = Math.max(1024, Math.min(8192, callback.getMaxBufferSize()));
                      int off = 0;
                      while (off < data.pcm16.length && !stopped.get()) {
                          int n = Math.min(max, data.pcm16.length - off);
                          int r = callback.audioAvailable(data.pcm16, off, n);
                          if (r != TextToSpeech.SUCCESS) { callback.error(); return; }
                          off += n;
                      }
                      if (stopped.get()) callback.error(); else callback.done();
                  } catch (Throwable t) {
                      callback.error();
                  }
              }
          }
