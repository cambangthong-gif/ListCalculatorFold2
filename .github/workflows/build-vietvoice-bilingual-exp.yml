          cat > app/src/main/java/com/cambangthong/vietvoicebilingual/MainActivity.java <<'EOF'
          package com.cambangthong.vietvoicebilingual;

          import android.Manifest;
          import android.content.*;
          import android.content.pm.PackageManager;
          import android.media.MediaPlayer;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.speech.tts.TextToSpeech;
          import android.view.View;
          import android.widget.*;
          import androidx.annotation.Nullable;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import java.io.*;

          public class MainActivity extends AppCompatActivity {
              private static final int REQ_PICK = 20, REQ_MIC = 21;
              private TextView txtReference, txtStatus;
              private Button btnRecord, btnPick, btnPreview, btnTest, btnTtsSettings;
              private CheckBox checkConsent;
              private EditText editTest;
              private ProgressBar progress;
              private final WavRecorder recorder = new WavRecorder();
              private MediaPlayer player;
              private TextToSpeech tts;

              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  setContentView(com.cambangthong.vietvoicebilingual.R.layout.activity_main);
                  txtReference = findViewById(R.id.txtReference);
                  txtStatus = findViewById(R.id.txtStatus);
                  btnRecord = findViewById(R.id.btnRecord);
                  btnPick = findViewById(R.id.btnPick);
                  btnPreview = findViewById(R.id.btnPreview);
                  btnTest = findViewById(R.id.btnTest);
                  btnTtsSettings = findViewById(R.id.btnTtsSettings);
                  checkConsent = findViewById(R.id.checkConsent);
                  editTest = findViewById(R.id.editTest);
                  progress = findViewById(R.id.progress);

                  checkConsent.setChecked(AppPrefs.consent(this));
                  checkConsent.setOnCheckedChangeListener((v, checked) -> AppPrefs.setConsent(this, checked));
                  btnPick.setOnClickListener(v -> pick());
                  btnRecord.setOnClickListener(v -> toggleRecord());
                  btnPreview.setOnClickListener(v -> preview());
                  btnTest.setOnClickListener(v -> testTts());
                  btnTtsSettings.setOnClickListener(v -> {
                      try { startActivity(new Intent("com.android.settings.TTS_SETTINGS")); }
                      catch (Exception e) { toast("Không mở được cài đặt TTS"); }
                  });
                  updateRefUi();
              }

              private void pick() {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("audio/*");
                  startActivityForResult(i, REQ_PICK);
              }

              private void toggleRecord() {
                  if (recorder.isRecording()) {
                      recorder.stop();
                      btnRecord.setText("Ghi âm");
                      txtStatus.setText("Đã lưu mẫu ghi âm.");
                      updateRefUi();
                      return;
                  }
                  if (ActivityCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.RECORD_AUDIO}, REQ_MIC);
                      return;
                  }
                  try {
                      File f = AppPrefs.ref(this);
                      recorder.start(f);
                      btnRecord.setText("Dừng ghi");
                      txtStatus.setText("Đang ghi… dừng sau khoảng 3–5 giây.");
                  } catch (Exception e) { toast(e.getMessage()); }
              }

              @Override public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grants) {
                  super.onRequestPermissionsResult(requestCode, permissions, grants);
                  if (requestCode == REQ_MIC && grants.length > 0 && grants[0] == PackageManager.PERMISSION_GRANTED) toggleRecord();
              }

              @Override protected void onActivityResult(int requestCode, int resultCode, @Nullable Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQ_PICK && resultCode == RESULT_OK && data != null && data.getData() != null) {
                      Uri uri = data.getData();
                      progress.setVisibility(View.VISIBLE);
                      txtStatus.setText("Đang chép mẫu giọng…");
                      new Thread(() -> {
                          try (InputStream in = getContentResolver().openInputStream(uri);
                               FileOutputStream out = new FileOutputStream(AppPrefs.ref(this))) {
                              if (in == null) throw new IOException("Không mở được file");
                              byte[] buf = new byte[8192]; int n;
                              while ((n = in.read(buf)) > 0) out.write(buf,0,n);
                              runOnUiThread(() -> { progress.setVisibility(View.GONE); txtStatus.setText("Đã lưu mẫu giọng."); updateRefUi(); });
                          } catch (Exception e) {
                              runOnUiThread(() -> { progress.setVisibility(View.GONE); toast("Lỗi: " + e.getMessage()); });
                          }
                      }).start();
                  }
              }

              private void updateRefUi() {
                  File f = AppPrefs.ref(this);
                  if (f.isFile()) {
                      txtReference.setText("Đã có mẫu: reference.wav · " + (f.length()/1024) + " KB");
                      btnPreview.setEnabled(true);
                  } else {
                      txtReference.setText("Chưa có mẫu. Nên dùng 3–5 giây, nói rõ, ít ồn.");
                      btnPreview.setEnabled(false);
                  }
              }

              private void preview() {
                  try {
                      if (player != null) { player.release(); player = null; }
                      player = new MediaPlayer();
                      player.setDataSource(AppPrefs.ref(this).getAbsolutePath());
                      player.prepare();
                      player.start();
                  } catch (Exception e) { toast("Không phát được mẫu: " + e.getMessage()); }
              }

              private void testTts() {
                  if (!checkConsent.isChecked()) { toast("Cần bật ô đồng ý trước."); return; }
                  if (!AppPrefs.ref(this).isFile()) { toast("Hãy chọn hoặc ghi mẫu giọng trước."); return; }
                  String s = editTest.getText().toString().trim();
                  if (s.isEmpty()) return;
                  progress.setVisibility(View.VISIBLE);
                  txtStatus.setText("Đang gọi VieNeu… public ZeroGPU có thể phải chờ.");
                  if (tts != null) { try { tts.shutdown(); } catch (Exception ignored) {} }
                  tts = new TextToSpeech(this, status -> {
                      if (status == TextToSpeech.SUCCESS) {
                          txtStatus.setText("Đang tổng hợp. Nếu chưa nghe ngay, chờ hàng ZeroGPU.");
                          tts.speak(s, TextToSpeech.QUEUE_FLUSH, null, "mixed-test");
                      } else {
                          progress.setVisibility(View.GONE);
                          txtStatus.setText("Không khởi tạo được VietVoice Bilingual TTS.");
                      }
                  }, getPackageName());
                  // progress is only a coarse indicator; synthesis callback belongs to Android TTS service.
                  progress.postDelayed(() -> progress.setVisibility(View.GONE), 45000);
              }

              private void toast(String s) { Toast.makeText(this, s == null ? "Có lỗi" : s, Toast.LENGTH_LONG).show(); }

              @Override protected void onDestroy() {
                  if (recorder.isRecording()) recorder.stop();
                  if (player != null) player.release();
                  if (tts != null) tts.shutdown();
                  super.onDestroy();
              }
          }
