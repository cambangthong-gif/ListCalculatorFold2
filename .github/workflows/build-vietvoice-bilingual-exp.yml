      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint -x test --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n1)"
          test -n "$APK"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt" dump badging "$APK" | tee badging.txt
          grep -q "package: name='com.cambangthong.vietvoicebilingual'" badging.txt
          grep -q "application-label:'VietVoice Bilingual'" badging.txt
          cp "$APK" VietVoice-Bilingual-Experimental-v0.2-ZFold6.apk
          sha256sum VietVoice-Bilingual-Experimental-v0.2-ZFold6.apk | tee SHA256.txt
          ls -lh VietVoice-Bilingual-Experimental-v0.2-ZFold6.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VietVoice-Bilingual-Experimental-v0.2-ZFold6
          path: |
            VietVoice-Bilingual-Experimental-v0.2-ZFold6.apk
            SHA256.txt
            badging.txt
          if-no-files-found: error
