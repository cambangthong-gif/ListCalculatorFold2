name: Build VietVoice Bilingual Experimental v0.2

on:
  push:
    branches: [vietvoice-bilingual-exp]
    paths:
      - '.github/workflows/build-vietvoice-bilingual-exp.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/cambangthong/vietvoicebilingual
          mkdir -p app/src/main/res/{layout,values,drawable,xml}

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'VietVoiceBilingual'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.cambangthong.vietvoicebilingual'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.cambangthong.vietvoicebilingual'
                  minSdk 26
                  targetSdk 35
                  versionCode 2
                  versionName '0.2-exp'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">VietVoice Bilingual</string>
              <string name="tts_engine_name">VietVoice Bilingual</string>
          </resources>
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="seed">#6750A4</color>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.VietVoiceBilingual" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/seed</item>
                  <item name="android:navigationBarColor">?attr/colorSurface</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_voice.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp" android:height="48dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#6750A4"
                  android:pathData="M12,3a3,3 0,0 0,-3 3v5a3,3 0,0 0,6 0V6a3,3 0,0 0,-3 -3zM5,11a1,1 0,0 1,2 0a5,5 0,0 0,10 0a1,1 0,0 1,2 0a7,7 0,0 1,-6 6.92V21h3a1,1 0,0 1,0 2H8a1,1 0,0 1,0 -2h3v-3.08A7,7 0,0 1,5 11z"/>
          </vector>
          EOF

          cat > app/src/main/res/xml/tts_engine.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <tts-engine xmlns:android="http://schemas.android.com/apk/res/android"
              android:settingsActivity="com.cambangthong.vietvoicebilingual.MainActivity" />
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE"/>
                  </intent>
              </queries>
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_voice"
                  android:label="VietVoice Bilingual"
                  android:theme="@style/Theme.VietVoiceBilingual"
                  android:usesCleartextTraffic="false">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".VietVoiceBilingualService"
                      android:label="VietVoice Bilingual"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.TTS_SERVICE"/>
                      </intent-filter>
                      <meta-data android:name="android.speech.tts" android:resource="@xml/tts_engine"/>
                  </service>
              </application>
          </manifest>
          EOF

