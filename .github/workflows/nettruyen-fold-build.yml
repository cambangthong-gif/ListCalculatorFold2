name: NetTruyen Fold Build

on:
  push:
    branches:
      - nettruyen-fold-reader-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source
        shell: bash
        run: |
          cat .buildsrc/part00 .buildsrc/part01 .buildsrc/part02 .buildsrc/part03 | base64 -d > /tmp/nettruyen-source.zip
          unzip -q /tmp/nettruyen-source.zip -d /tmp/nettruyen-src
          test -f /tmp/nettruyen-src/NetTruyenFoldOnline/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: /tmp/nettruyen-src/NetTruyenFoldOnline
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p out
          cp /tmp/nettruyen-src/NetTruyenFoldOnline/app/build/outputs/apk/debug/app-debug.apk out/NetTruyenFold-Online-Native-Test1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetTruyenFold-Online-Native-Test1
          path: out/NetTruyenFold-Online-Native-Test1.apk
          if-no-files-found: error
