name: Build ALAD Windows v2 clean

on:
  push:
    branches:
      - alad-windows-v1-build
    paths:
      - 'alad-windows-v2/**'
      - '.github/workflows/alad-windows-v2-clean.yml'

jobs:
  publish:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        rid: [win-arm64, win-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore alad-windows-v2/AladWindowsV2.csproj -r ${{ matrix.rid }}
      - name: Publish
        run: dotnet publish alad-windows-v2/AladWindowsV2.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -o out/${{ matrix.rid }}
      - name: Rename
        shell: pwsh
        run: Copy-Item "out/${{ matrix.rid }}/ALAD-Windows-v2.exe" "out/${{ matrix.rid }}/ALAD-Windows-v2-${{ matrix.rid }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: ALAD-Windows-v2-${{ matrix.rid }}
          path: out/${{ matrix.rid }}/ALAD-Windows-v2-${{ matrix.rid }}.exe
