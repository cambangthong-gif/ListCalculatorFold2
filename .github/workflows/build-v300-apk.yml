          void showCancelCropDialog(Uri uri){
              try{
                  Bitmap bmp=loadCancelCropBitmap(uri);
                  if(bmp==null){Toast.makeText(this,"Không mở được ảnh",Toast.LENGTH_LONG).show();return;}

                  LinearLayout box=new LinearLayout(this);box.setOrientation(LinearLayout.VERTICAL);
                  TextView tip=text("Kéo khung xanh vào đúng bảng/tỉnh cần nhập Hủy. Kéo 4 chấm trắng để chỉnh góc.",12,false);
                  tip.setTextColor(muted);tip.setPadding(dp(14),dp(8),dp(14),dp(8));box.addView(tip);

                  CancelCropView crop=new CancelCropView(this,bmp);
                  int h=Math.min(dp(620),(int)(getResources().getDisplayMetrics().heightPixels*.62f));
                  box.addView(crop,new LinearLayout.LayoutParams(-1,h));

                  LinearLayout tools=new LinearLayout(this);tools.setPadding(dp(10),dp(8),dp(10),0);
                  Button all=smallActionButton("Toàn ảnh");all.setOnClickListener(v->{haptic(v);crop.selectAll();});
                  Button hint=smallActionButton("Chọn lại vùng");hint.setOnClickListener(v->{haptic(v);crop.sel.set(0,0,0,0);crop.invalidate();});
                  tools.addView(all,new LinearLayout.LayoutParams(0,dp(44),1));
                  tools.addView(hint,new LinearLayout.LayoutParams(0,dp(44),1));
                  box.addView(tools);

                  AlertDialog dlg=new AlertDialog.Builder(this).setTitle("Chọn vùng nhập Hủy")
                      .setView(box)
                      .setPositiveButton("Nhận dạng vùng chọn",null)
                      .setNegativeButton("Hủy",null).create();

                  dlg.setOnShowListener(x->{
                      dlg.getButton(AlertDialog.BUTTON_POSITIVE).setOnClickListener(v->{
                          Bitmap chosen=crop.selectedBitmap();
                          dlg.dismiss();
                          runCancelSheetOcrBitmap(chosen);
                      });
                  });
                  dlg.show();
              }catch(Exception e){
                  Toast.makeText(this,"Không mở được ảnh để chọn vùng: "+e.getMessage(),Toast.LENGTH_LONG).show();
              }
          }

          void runCancelSheetOcrBitmap(Bitmap bmp){
              if(bmp==null){Toast.makeText(this,"Vùng chọn không hợp lệ",Toast.LENGTH_LONG).show();return;}
              try{
                  File f=new File(getCacheDir(),"cancel_crop_"+System.currentTimeMillis()+".jpg");
                  try(FileOutputStream os=new FileOutputStream(f)){bmp.compress(Bitmap.CompressFormat.JPEG,94,os);}
                  Toast.makeText(this,"Đang nhận dạng vùng đã chọn…",Toast.LENGTH_SHORT).show();
                  runCancelSheetOcr(Uri.fromFile(f));
              }catch(Exception e){
                  Toast.makeText(this,"Không xử lý được vùng chọn: "+e.getMessage(),Toast.LENGTH_LONG).show();
              }
          }

