name: Build ListCalculatorFold2 v2.9.6 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-v296-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply v2.9.1 base patch
        shell: bash
        run: |
          python3 - <<'PY'
          import re, pathlib, base64, gzip
          p=pathlib.Path('.github/workflows/build-v291-apk.yml').read_text()
          m=re.search(r"PATCH_GZ_B64:\s*'([^']+)'", p)
          if not m:
              raise SystemExit('Cannot find v2.9.1 patch')
          pathlib.Path('/tmp/v291.patch').write_bytes(gzip.decompress(base64.b64decode(m.group(1))))
          PY
          git apply --check /tmp/v291.patch
          git apply /tmp/v291.patch

      - name: Apply v2.9.4 feature patch
        shell: bash
        run: |
          cat .github/patches/v294.part0 .github/patches/v294.part1 .github/patches/v294.part2 .github/patches/v294.part3 | base64 --decode | gzip --decompress > /tmp/v294.patch
          git apply --check /tmp/v294.patch
          git apply /tmp/v294.patch
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text()
          if "com.google.mlkit:text-recognition" not in s:
              s=s.replace("implementation 'androidx.recyclerview:recyclerview:1.4.0'","implementation 'androidx.recyclerview:recyclerview:1.4.0'\n    implementation 'com.google.mlkit:text-recognition:16.0.1'")
          if "kotlin-stdlib-jdk7" not in s:
              s += "\nconfigurations.configureEach {\n    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'\n    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'\n}\n"
          p.write_text(s)
          PY

      - name: Apply v2.9.6 Fold adaptive-grid patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/vinh/listcalculatorfold2/MainActivity.java')
          s=p.read_text()

          def rep(old,new,n=1):
              global s
              if old not in s:
                  raise SystemExit('Missing anchor: '+old[:90].replace('\n',' '))
              s=s.replace(old,new,n)

          # v2.9.5: OCR chooser buttons visible on large Fold dialog.
          rep('''    void showCancelPhotoMenu(){
        String[] opts={"📷 Chụp tờ hủy","🖼 Chọn ảnh từ máy"};
        new AlertDialog.Builder(this)
            .setTitle("Nhận số liệu tờ hủy")
            .setMessage("App sẽ đọc cột Vé hủy, ghép theo tên đại lý và luôn cho kiểm tra/sửa trước khi nhập.")
            .setItems(opts,(d,i)->{
                if(i==0)launchCancelSheetCamera();
                else launchCancelSheetGallery();
            })
            .setNegativeButton("Hủy",null).show();
    }''','''    void showCancelPhotoMenu(){
        LinearLayout box=new LinearLayout(this);
        box.setOrientation(LinearLayout.VERTICAL);
        box.setPadding(dp(18),dp(8),dp(18),dp(10));

        TextView note=text("App sẽ đọc cột Vé hủy, ghép theo tên đại lý và luôn cho kiểm tra/sửa trước khi nhập.",13,false);
        note.setTextColor(muted);
        note.setPadding(0,0,0,dp(14));
        box.addView(note);

        Button camera=largeActionButton("📷  Chụp tờ hủy");
        camera.setTextColor(accent);
        camera.setMinHeight(dp(56));
        box.addView(camera,new LinearLayout.LayoutParams(-1,dp(58)));

        Space gap=new Space(this);
        box.addView(gap,new LinearLayout.LayoutParams(-1,dp(10)));

        Button gallery=largeActionButton("🖼  Chọn ảnh từ máy");
        gallery.setTextColor(Color.rgb(55,72,98));
        gallery.setMinHeight(dp(56));
        box.addView(gallery,new LinearLayout.LayoutParams(-1,dp(58)));

        AlertDialog dlg=new AlertDialog.Builder(this)
            .setTitle("Nhận số liệu tờ hủy")
            .setView(box)
            .setNegativeButton("Hủy",null)
            .create();

        camera.setOnClickListener(v->{haptic(v);dlg.dismiss();launchCancelSheetCamera();});
        gallery.setOnClickListener(v->{haptic(v);dlg.dismiss();launchCancelSheetGallery();});
        dlg.show();
    }''')

          # Global state for Fold inner adaptive table.
          rep('''    boolean compact=false;
    boolean compactLandscape=false;
    boolean redMagic8Pro=false;''','''    boolean compact=false;
    boolean compactLandscape=false;
    boolean redMagic8Pro=false;
    boolean foldInnerLayout=false;''')

          rep('''        boolean foldInnerWide=!compact && swDp>=760 && shDp>=600;
        lastWidthBucket=compact?0:(smallTablet?1:(largeTablet?3:2));''','''        boolean foldInnerWide=!compact && swDp>=760 && shDp>=600;
        foldInnerLayout=foldInnerWide;
        lastWidthBucket=compact?0:(smallTablet?1:(largeTablet?3:2));''')

          # Responsive column proportions + enough visual rows for large inner screen.
          rep('''    int dataRowDp(){''','''    float calcSttWeight(){return foldInnerLayout?0.52f:(compact?0.58f:0.45f);}
    float calcPriceWeight(){return foldInnerLayout?2.45f:2f;}
    float calcQtyWeight(){return foldInnerLayout?1.30f:1f;}
    float calcTotalWeight(){return foldInnerLayout?2.75f:2f;}

    float cancelSttWeight(){return foldInnerLayout?0.45f:0.38f;}
    float cancelAgentWeight(){return foldInnerLayout?4.30f:3.5f;}
    float cancelQtyWeight(){return foldInnerLayout?2.25f:1.65f;}

    int gridMinRows(){
        android.content.res.Configuration c=getResources().getConfiguration();
        if(!foldInnerLayout)return 8;
        int h=Math.max(c.screenHeightDp,c.screenWidthDp);
        int row=Math.max(42,dataRowDp());
        return Math.max(9,Math.min(14,(h-260)/row));
    }

    int dataRowDp(){''')

          rep('''        if(redMagic8Pro && compactLandscape)return 38;
        if(redMagic8Pro && compact)return 36;
        return w<380?43:(w<600?46:(w<840?52:54));''','''        if(redMagic8Pro && compactLandscape)return 38;
        if(redMagic8Pro && compact)return 36;
        if(foldInnerLayout)return densityMode==1?48:(densityMode==2?62:54);
        return w<380?43:(w<600?46:(w<840?52:54));''')

          rep('''        if(redMagic8Pro && compactLandscape)return 40;
        if(redMagic8Pro && compact)return 42;
        return w<380?44:(w<600?47:(w<840?54:56));''','''        if(redMagic8Pro && compactLandscape)return 40;
        if(redMagic8Pro && compact)return 42;
        if(foldInnerLayout)return densityMode==1?50:(densityMode==2?64:56);
        return w<380?44:(w<600?47:(w<840?54:56));''')

          # Header proportions.
          rep('''        head.addView(hSt,w(0,ViewGroup.LayoutParams.MATCH_PARENT,compact?0.58f:0.45f));
        head.addView(hPrice,w(0,ViewGroup.LayoutParams.MATCH_PARENT,2));
        head.addView(hQty,w(0,ViewGroup.LayoutParams.MATCH_PARENT,1));
        head.addView(hTotal,w(0,ViewGroup.LayoutParams.MATCH_PARENT,2));''','''        head.addView(hSt,w(0,ViewGroup.LayoutParams.MATCH_PARENT,calcSttWeight()));
        head.addView(hPrice,w(0,ViewGroup.LayoutParams.MATCH_PARENT,calcPriceWeight()));
        head.addView(hQty,w(0,ViewGroup.LayoutParams.MATCH_PARENT,calcQtyWeight()));
        head.addView(hTotal,w(0,ViewGroup.LayoutParams.MATCH_PARENT,calcTotalWeight()));''')

          rep('''        head.addView(hs,w(0,ViewGroup.LayoutParams.MATCH_PARENT,0.38f));
        head.addView(ha,w(0,ViewGroup.LayoutParams.MATCH_PARENT,3.5f));
        head.addView(hq,w(0,ViewGroup.LayoutParams.MATCH_PARENT,1.65f));''','''        head.addView(hs,w(0,ViewGroup.LayoutParams.MATCH_PARENT,cancelSttWeight()));
        head.addView(ha,w(0,ViewGroup.LayoutParams.MATCH_PARENT,cancelAgentWeight()));
        head.addView(hq,w(0,ViewGroup.LayoutParams.MATCH_PARENT,cancelQtyWeight()));''')

          # Data row proportions.
          rep('''            rr.addView(st,w(0,ViewGroup.LayoutParams.MATCH_PARENT,0.45f));
            rr.addView(p,w(0,ViewGroup.LayoutParams.MATCH_PARENT,2));
            rr.addView(q,w(0,ViewGroup.LayoutParams.MATCH_PARENT,1));
            rr.addView(total,w(0,ViewGroup.LayoutParams.MATCH_PARENT,2));''','''            rr.addView(st,w(0,ViewGroup.LayoutParams.MATCH_PARENT,calcSttWeight()));
            rr.addView(p,w(0,ViewGroup.LayoutParams.MATCH_PARENT,calcPriceWeight()));
            rr.addView(q,w(0,ViewGroup.LayoutParams.MATCH_PARENT,calcQtyWeight()));
            rr.addView(total,w(0,ViewGroup.LayoutParams.MATCH_PARENT,calcTotalWeight()));''')

          rep('''            rr.addView(st,w(0,ViewGroup.LayoutParams.MATCH_PARENT,0.38f));
            rr.addView(a,w(0,ViewGroup.LayoutParams.MATCH_PARENT,3.5f));
            rr.addView(q,w(0,ViewGroup.LayoutParams.MATCH_PARENT,1.65f));''','''            rr.addView(st,w(0,ViewGroup.LayoutParams.MATCH_PARENT,cancelSttWeight()));
            rr.addView(a,w(0,ViewGroup.LayoutParams.MATCH_PARENT,cancelAgentWeight()));
            rr.addView(q,w(0,ViewGroup.LayoutParams.MATCH_PARENT,cancelQtyWeight()));''')

          # Larger readable text on Fold inner screen.
          rep('''            TextView st=cell("",14,false,Gravity.CENTER);
            TextView p=cell("",15,false,Gravity.END|Gravity.CENTER_VERTICAL);
            TextView q=cell("",15,false,Gravity.END|Gravity.CENTER_VERTICAL);
            TextView total=cell("",15,false,Gravity.END|Gravity.CENTER_VERTICAL);''','''            TextView st=cell("",foldInnerLayout?15:14,false,Gravity.CENTER);
            TextView p=cell("",foldInnerLayout?18:15,false,Gravity.END|Gravity.CENTER_VERTICAL);
            TextView q=cell("",foldInnerLayout?18:15,false,Gravity.END|Gravity.CENTER_VERTICAL);
            TextView total=cell("",foldInnerLayout?18:15,false,Gravity.END|Gravity.CENTER_VERTICAL);''')

          rep('''            TextView st=cell("",14,false,Gravity.CENTER);
            TextView a=cell("",16,false,Gravity.START|Gravity.CENTER_VERTICAL);
            TextView q=cell("",15,false,Gravity.END|Gravity.CENTER_VERTICAL);''','''            TextView st=cell("",foldInnerLayout?15:14,false,Gravity.CENTER);
            TextView a=cell("",foldInnerLayout?18:16,false,Gravity.START|Gravity.CENTER_VERTICAL);
            TextView q=cell("",foldInnerLayout?18:15,false,Gravity.END|Gravity.CENTER_VERTICAL);''')

          rep('''        TextView hPrice=cell("Đơn giá",13,true,Gravity.CENTER);
        TextView hQty=cell("SL",13,true,Gravity.CENTER);
        TextView hTotal=cell("Thành tiền",13,true,Gravity.END|Gravity.CENTER_VERTICAL);''','''        TextView hPrice=cell("Đơn giá",foldInnerLayout?16:13,true,Gravity.CENTER);
        TextView hQty=cell("SL",foldInnerLayout?16:13,true,Gravity.CENTER);
        TextView hTotal=cell("Thành tiền",foldInnerLayout?16:13,true,Gravity.END|Gravity.CENTER_VERTICAL);''')

          rep('''        TextView hs=cell("#",13,true,Gravity.CENTER);
        TextView ha=cell("Tên đại lý",14,true,Gravity.START|Gravity.CENTER_VERTICAL);
        TextView hq=cell("Số lượng",14,true,Gravity.END|Gravity.CENTER_VERTICAL);''','''        TextView hs=cell("#",foldInnerLayout?15:13,true,Gravity.CENTER);
        TextView ha=cell("Tên đại lý",foldInnerLayout?17:14,true,Gravity.START|Gravity.CENTER_VERTICAL);
        TextView hq=cell("Số lượng",foldInnerLayout?17:14,true,Gravity.END|Gravity.CENTER_VERTICAL);''')

          rep('''        @Override public int getItemCount(){return Math.max(8,t.calcRows.size());}''','''        @Override public int getItemCount(){return Math.max(gridMinRows(),t.calcRows.size());}''')
          rep('''        @Override public int getItemCount(){return Math.max(8,t.cancelRows.size());}''','''        @Override public int getItemCount(){return Math.max(gridMinRows(),t.cancelRows.size());}''')

          # More pixels to the data table; less dead space in left/right rails.
          rep('''            workspace.addView(right,new LinearLayout.LayoutParams(0,-1,1.62f));''','''            workspace.addView(right,new LinearLayout.LayoutParams(0,-1,1.95f));''')
          rep('''            workspace.addView(toolRail,new LinearLayout.LayoutParams(0,-1,.90f));''','''            workspace.addView(toolRail,new LinearLayout.LayoutParams(0,-1,.72f));''')
          rep('''        int sideDp=foldInnerWide?Math.max(210,Math.min(250,(int)(swDp*.24f))):responsiveSideDp(swDp);''','''        int sideDp=foldInnerWide?Math.max(200,Math.min(230,(int)(swDp*.215f))):responsiveSideDp(swDp);''')

          s=s.replace('Phiên bản 2.9.4','Phiên bản 2.9.6')
          p.write_text(s)
          PY

          sed -i 's/pushUndoSnapshot(/pushUndo(/g' app/src/main/java/com/vinh/listcalculatorfold2/MainActivity.java
          sed -i -E 's/versionCode [0-9]+/versionCode 296/' app/build.gradle
          sed -i -E "s/versionName '[^']+'/versionName '2.9.6'/" app/build.gradle
          grep -nE 'versionCode|versionName|text-recognition' app/build.gradle

      - name: Restore stable signing key
        shell: bash
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/listcalculator-update.jks"
          test -s "$RUNNER_TEMP/listcalculator-update.jks"

      - name: Build signed release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/listcalculator-update.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --stacktrace
          test -f app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk ListCalculatorFold2-v2.9.6-FoldAdaptiveGrid-OCR.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ListCalculatorFold2-v2.9.6-FoldAdaptiveGrid-OCR
          path: ListCalculatorFold2-v2.9.6-FoldAdaptiveGrid-OCR.apk
          if-no-files-found: error
