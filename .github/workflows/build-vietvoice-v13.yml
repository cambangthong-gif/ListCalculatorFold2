name: Build VietVoice TTS v1.3

on:
  push:
    branches:
      - ngocngan-tts-build
    paths:
      - '.github/workflows/build-vietvoice-v13.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Clone sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch ngocngan-tts-build https://github.com/cambangthong-gif/ListCalculatorFold2.git self
          git clone --depth 1 https://github.com/CodeBySonu95/VoxSherpa-TTS.git vox

      - name: Reuse v1.2 patch and force clean VietVoice labels
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          src = Path('self/.github/workflows/build-vietvoice-v12.yml').read_text().splitlines()
          start = None
          for i, line in enumerate(src):
              if line.strip() == '- name: Patch VietVoice branding and Vietnamese catalog':
                  for j in range(i + 1, len(src)):
                      if src[j].strip() == 'run: |':
                          start = j + 1
                          break
                  break
          if start is None:
              raise SystemExit('Cannot find v1.2 patch step')
          out = []
          for line in src[start:]:
              if line.startswith('      - name:'):
                  break
              if line.startswith('          '):
                  out.append(line[10:])
              elif not line.strip():
                  out.append('')
              else:
                  raise SystemExit('Unexpected indentation while extracting patch step: ' + line)
          Path('patch_v12.sh').write_text('\n'.join(out) + '\n')
          PY
          chmod +x patch_v12.sh
          ./patch_v12.sh

          cd vox
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Bump version after the v1.2 patch.
          p = Path('app/build.gradle')
          s = p.read_text()
          s = re.sub(r'versionCode\s+\d+', 'versionCode 1300', s, count=1)
          s = re.sub(r'versionName\s+"[^"]+"', 'versionName "1.3-vietnamese"', s, count=1)
          p.write_text(s)

          # Samsung launcher may resolve localized app_name. Patch every values locale.
          for p in Path('app/src/main/res').glob('values*/strings.xml'):
              s = p.read_text()
              s = re.sub(r'(<string\s+name="app_name"[^>]*>).*?(</string>)', r'\1VietVoice TTS\2', s, flags=re.S)
              # Replace only visible branding strings; never Java package/class names.
              s = s.replace('VoxSherpa TTS', 'VietVoice TTS')
              s = re.sub(r'(?<=>)VoxSherpa(?=<)', 'VietVoice TTS', s)
              p.write_text(s)

          # Force application + TTS service labels so locale resources cannot override them.
          p = Path('app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('android:label="@string/app_name"', 'android:label="VietVoice TTS"', 1)
          s = s.replace('android:label="VoxSherpa TTS"', 'android:label="VietVoice TTS"')
          s = s.replace('android:label="VoxSherpa"', 'android:label="VietVoice TTS"')
          # If the launcher activity has its own old label, replace it too.
          s = s.replace('android:label="@string/app_name"', 'android:label="VietVoice TTS"')
          p.write_text(s)

          # Visible exact branding in layouts.
          for p in Path('app/src/main/res/layout').glob('*.xml'):
              s = p.read_text()
              s = s.replace('android:text="VoxSherpa TTS"', 'android:text="VietVoice TTS"')
              s = s.replace('android:text="VoxSherpa"', 'android:text="VietVoice TTS"')
              s = s.replace('>VoxSherpa TTS<', '>VietVoice TTS<')
              s = s.replace('>VoxSherpa<', '>VietVoice TTS<')
              p.write_text(s)
          PY

          echo 'Remaining visible branding in resources/manifest:'
          grep -Rni --include='*.xml' 'VoxSherpa TTS' app/src/main/res app/src/main/AndroidManifest.xml || true

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd vox
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon -x test -x lint --stacktrace

      - name: Verify labels, signature and package APK
        shell: bash
        run: |
          set -euo pipefail
          cd vox
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt" dump badging "$APK" | tee ../badging-v13.txt

          grep -q "package: name='com.cambangthong.VietVoiceTTS'" ../badging-v13.txt
          grep -q "application-label:'VietVoice TTS'" ../badging-v13.txt
          if grep -E "application-label[^:]*:'VoxSherpa( TTS)?'" ../badging-v13.txt; then
            echo 'ERROR: old launcher label still present'
            exit 1
          fi

          cp "$APK" ../VietVoice-TTS-v1.3-ZFold6-arm64.apk
          cd ..
          sha256sum VietVoice-TTS-v1.3-ZFold6-arm64.apk | tee SHA256-vietvoice-v13.txt
          grep -E "^(package:|application-label)" badging-v13.txt | head -n 30
          ls -lh VietVoice-TTS-v1.3-ZFold6-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VietVoice-TTS-v1.3-ZFold6-arm64
          path: |
            VietVoice-TTS-v1.3-ZFold6-arm64.apk
            SHA256-vietvoice-v13.txt
            badging-v13.txt
          if-no-files-found: error
