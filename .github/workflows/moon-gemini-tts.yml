name: Moon Gemini TTS APK
on:
  push:
    branches: [moon-reader-gemini-tts]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile APK
        run: cd moon-gemini-tts && gradle --no-daemon assembleDebug
      - name: Upload built APK
        uses: actions/upload-artifact@v4
        with:
          name: moon-gemini-tts-apk
          path: moon-gemini-tts/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
