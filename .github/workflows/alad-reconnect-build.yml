name: Build ALAD TTS Select v3.3 No-Pause APK

on:
  push:
    branches:
      - alad-reconnect-build
    paths:
      - '.github/workflows/alad-reconnect-build.yml'
      - 'build-trigger.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4

      - name: Clone ALAD Mobile upstream
        run: git clone --depth 1 https://github.com/navidseyedain/ALAD-Mobile.git alad

      - name: Apply ALAD TTS Select v3.3 patches
        run: |
          cp patches/build.gradle.kts alad/app/build.gradle.kts
          cp patches/AndroidManifest.xml alad/app/src/main/AndroidManifest.xml
          cp patches/strings.xml alad/app/src/main/res/values/strings.xml
          cp patches/ALADWebSocketManager.kt alad/app/src/main/kotlin/com/alad/app/core/network/ALADWebSocketManager.kt
          cp patches/AudioDubbingForegroundService.kt alad/app/src/main/kotlin/com/alad/app/core/service/AudioDubbingForegroundService.kt
          cp patches/AudioPlayerManager.kt alad/app/src/main/kotlin/com/alad/app/core/audio/AudioPlayerManager.kt
          cp patches/DeviceTtsManager.kt alad/app/src/main/kotlin/com/alad/app/core/audio/DeviceTtsManager.kt
          cp patches/TtsCatalog.kt alad/app/src/main/kotlin/com/alad/app/core/audio/TtsCatalog.kt
          cp patches/OverlayWidgetService.kt alad/app/src/main/kotlin/com/alad/app/core/service/OverlayWidgetService.kt
          cp patches/UserPreferencesRepository.kt alad/app/src/main/kotlin/com/alad/app/data/repository/UserPreferencesRepository.kt
          cp patches/SettingsViewModel.kt alad/app/src/main/kotlin/com/alad/app/presentation/settings/SettingsViewModel.kt
          cp patches/SettingsScreen.kt alad/app/src/main/kotlin/com/alad/app/presentation/settings/SettingsScreen.kt

          python3 - <<'PY'
          from pathlib import Path

          # v3.3 uses a separate applicationId so it can be installed beside v2/v3/v3.1/v3.2.
          p = Path('alad/app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('applicationId = "com.alad.app.tts.v31"', 'applicationId = "com.alad.app.tts.v33"')
          s = s.replace('versionCode = 31', 'versionCode = 33')
          s = s.replace('versionName = "1.3.1-tts-select"', 'versionName = "1.3.3-no-pause"')
          p.write_text(s)

          p = Path('alad/app/src/main/res/values/strings.xml')
          s = p.read_text().replace('ALAD TTS Select v3.1', 'ALAD TTS Select v3.3 No-Pause')
          p.write_text(s)

          # Wire original-volume preference into the foreground service.
          p = Path('alad/app/src/main/kotlin/com/alad/app/core/service/AudioDubbingForegroundService.kt')
          s = p.read_text()
          s = s.replace(
              'val volumeRatio = prefs.volumeRatioFlow.first()\n            val dubMode = prefs.dubModeFlow.first()',
              'val volumeRatio = prefs.volumeRatioFlow.first()\n            val originalVolume = prefs.originalVolumeFlow.first()\n            val dubMode = prefs.dubModeFlow.first()'
          )
          s = s.replace(
              'outputVolume = volumeRatio,\n                        catchUp = catchUp,',
              'outputVolume = volumeRatio,\n                        originalLevel = originalVolume,\n                        mode = dubMode,\n                        catchUp = catchUp,'
          )
          s = s.replace(
              'volume = volumeRatio,\n                        syncMs = manualSync,',
              'volume = volumeRatio,\n                        originalLevel = originalVolume,\n                        syncMs = manualSync,'
          )
          p.write_text(s)

          # Add original-audio slider to Settings.
          p = Path('alad/app/src/main/kotlin/com/alad/app/presentation/settings/SettingsScreen.kt')
          s = p.read_text()
          s = s.replace(
              'val aiVolume by viewModel.volumeRatio.collectAsState()\n    val dubMode',
              'val aiVolume by viewModel.volumeRatio.collectAsState()\n    val originalVolume by viewModel.originalVolume.collectAsState()\n    val dubMode'
          )
          needle = '''                    Slider(\n                        value = aiVolume,\n                        onValueChange = viewModel::updateVolumeRatio,\n                        valueRange = 0.20f..1.0f\n                    )'''
          insert = needle + '''\n\n                    Spacer(modifier = Modifier.height(14.dp))\n                    SettingLabel("Âm lượng tiếng gốc ${(originalVolume * 100).roundToInt()}%")\n                    Slider(\n                        value = originalVolume,\n                        onValueChange = viewModel::updateOriginalVolume,\n                        valueRange = 0f..1.0f\n                    )\n                    Text(\n                        "No-Pause: 100% = không can thiệp; dưới 85% = chỉ dùng Audio Focus MAY_DUCK. Không còn dùng focus mạnh nên YouTube/X không bị ALAD yêu cầu dừng. Mức giảm thực tế vẫn phụ thuộc app nguồn.",\n                        color = TextSecondary,\n                        fontSize = 12.sp,\n                        lineHeight = 18.sp\n                    )'''
          if needle not in s:
              raise SystemExit('Could not find AI volume slider insertion point')
          s = s.replace(needle, insert, 1)
          p.write_text(s)

          # Critical no-pause hotfix: never request AUDIOFOCUS_GAIN_TRANSIENT.
          # Even at 0% original volume/full-dub, only MAY_DUCK is allowed.
          for rel in [
              'alad/app/src/main/kotlin/com/alad/app/core/audio/AudioPlayerManager.kt',
              'alad/app/src/main/kotlin/com/alad/app/core/audio/DeviceTtsManager.kt',
          ]:
              p = Path(rel)
              s = p.read_text()
              old = '''        return if (originalVolume <= 0.15f || dubMode == "full_dub") {\n            AudioManager.AUDIOFOCUS_GAIN_TRANSIENT\n        } else {\n            AudioManager.AUDIOFOCUS_GAIN_TRANSIENT_MAY_DUCK\n        }'''
              new = '''        // Never request transient exclusive focus: some video apps pause playback.\n        // MAY_DUCK asks the source app to lower volume without asking it to stop.\n        return AudioManager.AUDIOFOCUS_GAIN_TRANSIENT_MAY_DUCK'''
              if old not in s:
                  raise SystemExit(f'Could not find strong focus block in {rel}')
              s = s.replace(old, new, 1)
              p.write_text(s)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: alad/**/*.gradle*

      - name: Build debug APK
        working-directory: alad
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp alad/app/build/outputs/apk/debug/app-debug.apk ALAD-TTS-Select-v3.3-NoPause.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALAD-TTS-Select-v3.3-NoPause
          path: ALAD-TTS-Select-v3.3-NoPause.apk
          if-no-files-found: error
