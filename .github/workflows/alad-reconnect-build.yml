name: Build ALAD TTS Select v4.8 Auto Reliable APK

on:
  push:
    branches:
      - alad-reconnect-build
    paths:
      - '.github/workflows/alad-reconnect-build.yml'
      - 'build-trigger.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4

      - name: Clone ALAD Mobile upstream
        run: git clone --depth 1 https://github.com/navidseyedain/ALAD-Mobile.git alad

      - name: Apply ALAD TTS Select v4.8 Auto Reliable patches
        run: |
          cp patches/build.gradle.kts alad/app/build.gradle.kts
          cp patches/AndroidManifest.xml alad/app/src/main/AndroidManifest.xml
          cp patches/strings.xml alad/app/src/main/res/values/strings.xml
          cp patches/ALADWebSocketManager.kt alad/app/src/main/kotlin/com/alad/app/core/network/ALADWebSocketManager.kt
          cp patches/AudioDubbingForegroundService.kt alad/app/src/main/kotlin/com/alad/app/core/service/AudioDubbingForegroundService.kt
          cp patches/AudioCaptureManager.kt alad/app/src/main/kotlin/com/alad/app/core/audio/AudioCaptureManager.kt
          cp patches/AudioPlayerManager.kt alad/app/src/main/kotlin/com/alad/app/core/audio/AudioPlayerManager.kt
          cp patches/DeviceTtsManager.kt alad/app/src/main/kotlin/com/alad/app/core/audio/DeviceTtsManager.kt
          cp patches/TtsCatalog.kt alad/app/src/main/kotlin/com/alad/app/core/audio/TtsCatalog.kt
          cp patches/OverlayWidgetService.kt alad/app/src/main/kotlin/com/alad/app/core/service/OverlayWidgetService.kt
          cp patches/UserPreferencesRepository.kt alad/app/src/main/kotlin/com/alad/app/data/repository/UserPreferencesRepository.kt
          cp patches/SettingsViewModel.kt alad/app/src/main/kotlin/com/alad/app/presentation/settings/SettingsViewModel.kt
          cp patches/SettingsScreen.kt alad/app/src/main/kotlin/com/alad/app/presentation/settings/SettingsScreen.kt
          cp patches/MainActivity.kt alad/app/src/main/kotlin/com/alad/app/MainActivity.kt
          mkdir -p alad/app/src/main/kotlin/com/alad/app/core/sync
          cp patches/SmartSyncManager.kt alad/app/src/main/kotlin/com/alad/app/core/sync/SmartSyncManager.kt
          cp patches/AudioClockSyncController.kt alad/app/src/main/kotlin/com/alad/app/core/sync/AudioClockSyncController.kt

          python3 - <<'PY'
          from pathlib import Path

          p = Path('alad/app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('applicationId = "com.alad.app.tts.v31"', 'applicationId = "com.alad.app.tts.v48"')
          s = s.replace('versionCode = 31', 'versionCode = 480')
          s = s.replace('versionName = "1.3.1-tts-select"', 'versionName = "1.4.8-auto-reliable"')
          p.write_text(s)

          p = Path('alad/app/src/main/res/values/strings.xml')
          s = p.read_text().replace('ALAD TTS Select v3.1', 'ALAD TTS Select v4.8 Auto Reliable')
          p.write_text(s)

          # Wire original-volume preference and preserve Fast-Reconnect from v3.4.
          p = Path('alad/app/src/main/kotlin/com/alad/app/core/service/AudioDubbingForegroundService.kt')
          s = p.read_text()
          s = s.replace(
              'val volumeRatio = prefs.volumeRatioFlow.first()\n            val dubMode = prefs.dubModeFlow.first()',
              'val volumeRatio = prefs.volumeRatioFlow.first()\n            val originalVolume = prefs.originalVolumeFlow.first()\n            val dubMode = prefs.dubModeFlow.first()'
          )
          s = s.replace(
              'outputVolume = volumeRatio,\n                        catchUp = catchUp,',
              'outputVolume = volumeRatio,\n                        originalLevel = originalVolume,\n                        mode = dubMode,\n                        catchUp = catchUp,'
          )
          s = s.replace(
              'volume = volumeRatio,\n                        syncMs = manualSync,',
              'volume = volumeRatio,\n                        originalLevel = originalVolume,\n                        syncMs = manualSync,'
          )
          s = s.replace(
              'volume = volumeRatio,\n                        syncMs = 0,',
              'volume = volumeRatio,\n                        originalLevel = originalVolume,\n                        syncMs = 0,'
          )
          s = s.replace('.pingInterval(15, TimeUnit.SECONDS)', '.pingInterval(5, TimeUnit.SECONDS)')
          s = s.replace(
              '.retryOnConnectionFailure(true)\n                .build()',
              '.retryOnConnectionFailure(true)\n                .connectTimeout(5, TimeUnit.SECONDS)\n                .writeTimeout(5, TimeUnit.SECONDS)\n                .build()'
          )
          s = s.replace(
              "val naturalBreak = endChar in listOf('.', '!', '?', '…', ':', ';', ',')",
              "val naturalBreak = endChar != null && endChar in listOf('.', '!', '?', '…', ':', ';', ',')"
          )
          p.write_text(s)

          # Add original-audio slider and explain target-language auto skip.
          p = Path('alad/app/src/main/kotlin/com/alad/app/presentation/settings/SettingsScreen.kt')
          s = p.read_text()
          s = s.replace(
              'val aiVolume by viewModel.volumeRatio.collectAsState()\n    val dubMode',
              'val aiVolume by viewModel.volumeRatio.collectAsState()\n    val originalVolume by viewModel.originalVolume.collectAsState()\n    val dubMode'
          )
          needle = '''                    Slider(\n                        value = aiVolume,\n                        onValueChange = viewModel::updateVolumeRatio,\n                        valueRange = 0.20f..1.0f\n                    )'''
          insert = needle + '''\n\n                    Spacer(modifier = Modifier.height(14.dp))\n                    SettingLabel("Âm lượng tiếng gốc ${(originalVolume * 100).roundToInt()}%")\n                    Slider(\n                        value = originalVolume,\n                        onValueChange = viewModel::updateOriginalVolume,\n                        valueRange = 0f..1.0f\n                    )\n                    Text(\n                        "v4.8 Auto Reliable: client activityStart/activityEnd chuẩn thay audioStreamEnd-as-VAD, resume-first Self-Heal, Auto VAD 420–680ms, zero-GC hot path và pipeline diagnostics.",\n                        color = TextSecondary,\n                        fontSize = 12.sp,\n                        lineHeight = 18.sp\n                    )'''
          if needle not in s:
              raise SystemExit('Could not find AI volume slider insertion point')
          s = s.replace(needle, insert, 1)
          p.write_text(s)

          # Preserve no-pause behavior: never request transient exclusive focus.
          for rel in [
              'alad/app/src/main/kotlin/com/alad/app/core/audio/AudioPlayerManager.kt',
              'alad/app/src/main/kotlin/com/alad/app/core/audio/DeviceTtsManager.kt',
          ]:
              p = Path(rel)
              s = p.read_text()
              old = '''        return if (originalVolume <= 0.15f || dubMode == "full_dub") {\n            AudioManager.AUDIOFOCUS_GAIN_TRANSIENT\n        } else {\n            AudioManager.AUDIOFOCUS_GAIN_TRANSIENT_MAY_DUCK\n        }'''
              new = '''        // Never request transient exclusive focus: some video apps pause playback.\n        return AudioManager.AUDIOFOCUS_GAIN_TRANSIENT_MAY_DUCK'''
              if old not in s:
                  raise SystemExit(f'Could not find strong focus block in {rel}')
              s = s.replace(old, new, 1)
              p.write_text(s)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: alad/**/*.gradle*

      - name: Build debug APK
        working-directory: alad
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp alad/app/build/outputs/apk/debug/app-debug.apk ALAD-TTS-Select-v4.8-AutoReliable.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALAD-TTS-Select-v4.8-AutoReliable
          path: ALAD-TTS-Select-v4.8-AutoReliable.apk
          if-no-files-found: error
