name: Build VietVoice Clone APK

on:
  push:
    branches: [ngocngan-tts-build]
    paths:
      - '.github/workflows/build-vietvoice-clone.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/cambangthong/vietvoiceclone
          mkdir -p app/src/main/res/layout app/src/main/res/values app/src/main/res/drawable

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "VietVoiceClone"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application") }

          android {
              namespace = "com.cambangthong.vietvoiceclone"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.cambangthong.vietvoiceclone"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 100
                  versionName = "1.0"
              }

              buildTypes {
                  getByName("release") {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">VietVoice Clone</string>
          </resources>
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="seed">#6750A4</color>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources xmlns:tools="http://schemas.android.com/tools">
              <style name="Theme.VietVoiceClone" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/seed</item>
                  <item name="android:navigationBarColor">?attr/colorSurface</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_mic.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp" android:height="48dp" android:viewportWidth="24" android:viewportHeight="24">
