name: Build ALAD Windows v4.1 full

on:
  push:
    branches: [ alad-windows-v1-build ]
    paths:
      - '.github/workflows/alad-windows-v4_1-full.yml'

jobs:
  publish:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        rid: [win-arm64, win-x64]
    env:
      KEY_UI_B64: ""
      VOL_UI_B64: ""
      FAST_B64: ""
      EVENT_B64: ""
      APPLY_B64: ""
      DUCKER_B64: " "
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Patch ALAD v4.1
        shell: pwsh
        run: |
          $p = 'alad-windows-v2/Program.cs'
          $c = Get-Content $p -Raw
          $nl = [Environment]::NewLine

          $c = $c.Replace('ALAD Windows v2 — Live Dubbing', 'ALAD Windows v4.1 — Live Dubbing')
          $c = $c.Replace('ALAD Windows v2', 'ALAD Windows v4.1')
          $c = $c.Replace('Gemini sẵn sàng · Low latency', 'Gemini sẵn sàng · continuous stream')

          # Android-like continuous input.
          $c = $c.Replace('            localVad.Reset();' + $nl, '')
          $c = $c.Replace('        localVad.Reset();' + $nl, '')
          $c = $c.Replace('                    if (lowLatency.Checked && localVad.Push(chunk)) gemini.SignalAudioStreamEnd();' + $nl, '')
          $rt = '(?s)        var realtimeInputConfig = new\s*\{.*?\r?\n        \};\r?\n\r?\n        object setup;'
          $c = [regex]::Replace($c, $rt, '        object setup;', 1)
          $c = [regex]::Replace($c, '(?m)^\s*realtimeInputConfig,\s*\r?\n', '')

          # Exact Gemini 3.5 Live Translate setup documented by Google.
          $fast = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:FAST_B64))
          $fastPattern = '(?s)        if \(mode == LiveMode\.FastTranslate\)\s*\{\s*setup = new\s*\{.*?\r?\n            \};\r?\n        \}\r?\n        else'
          $c2 = [regex]::Replace($c, $fastPattern, $fast, 1)
          if ($c2 -eq $c) { throw '3.5 setup was not replaced' }
          $c = $c2

          # API key helper buttons.
          $key = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:KEY_UI_B64))
          $keyPattern = '(?s)        var keyGrid = TwoColumnGrid\(\);\r?\n        apiKey\.Dock = DockStyle\.Fill;\r?\n        rememberKey\.Margin = new Padding\(12, 6, 0, 0\);\r?\n        keyGrid\.Controls\.Add\(apiKey, 0, 0\);\r?\n        keyGrid\.Controls\.Add\(rememberKey, 1, 0\);\r?\n        AddSetting\(root, "Gemini API key", keyGrid\);'
          $c2 = [regex]::Replace($c, $keyPattern, $key, 1)
          if ($c2 -eq $c) { throw 'API key UI was not replaced' }
          $c = $c2

          # Original-audio controls.
          $fieldNeedle = '    private readonly Label aiVolumeLabel = new() { Text = "100%", AutoSize = true };'
          $fieldReplacement = $fieldNeedle + $nl + '    private readonly TrackBar originalVolume = new() { Minimum = 0, Maximum = 100, TickFrequency = 10, Value = 100 };' + $nl + '    private readonly Label originalVolumeLabel = new() { Text = "100%", AutoSize = true };'
          if (-not $c.Contains($fieldNeedle)) { throw 'AI volume field marker missing' }
          $c = $c.Replace($fieldNeedle, $fieldReplacement)

          $volUi = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:VOL_UI_B64))
          $volMarker = '        AddSetting(root, "Âm lượng AI", volGrid);'
          if (-not $c.Contains($volMarker)) { throw 'AI volume UI marker missing' }
          $c = $c.Replace($volMarker, $volMarker + $nl + $nl + $volUi)

          $evt = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:EVENT_B64))
          $evtMarker = '        uiTimer.Tick += (_, _) => UpdateUiTelemetry();'
          if (-not $c.Contains($evtMarker)) { throw 'event marker missing' }
          $c = $c.Replace($evtMarker, $evt + $nl + $evtMarker)

          $duckerStart = '            ducker = new AudioDucker(Environment.ProcessId, LogStatus);'
          $c = $c.Replace($duckerStart, $duckerStart + $nl + '            ducker.SetBaseFactor(originalVolume.Value / 100f);' + $nl + '            ducker.ApplyBase(source.SelectedItem as ProcessItem);')

          $apply = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:APPLY_B64))
          $applyPattern = '(?s)    private void ApplyDucking\(bool aiSpeaking\)\s*\{.*?\r?\n    \}\r?\n\r?\n    private void UpdateUiTelemetry'
          $c2 = [regex]::Replace($c, $applyPattern, $apply + $nl + $nl + '    private void UpdateUiTelemetry', 1)
          if ($c2 -eq $c) { throw 'ApplyDucking replacement failed' }
          $c = $c2

          $ducker = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:DUCKER_B64))
          $duckerPattern = '(?s)internal sealed class AudioDucker : IDisposable\s*\{.*?\r?\n\}\r?\n\r?\ninternal sealed class LiveGeminiClient'
          $c2 = [regex]::Replace($c, $duckerPattern, $ducker + $nl + $nl + 'internal sealed class LiveGeminiClient', 1)
          if ($c2 -eq $c) { throw 'AudioDucker replacement failed' }
          $c = $c2

          Set-Content $p $c -Encoding UTF8

      - name: Verify patch
        shell: pwsh
        run: |
          $c = Get-Content 'alad-windows-v2/Program.cs' -Raw
          if ($c -match 'localVad\.Push\(') { throw 'local VAD still active' }
          if ($c -match 'activityHandling\s*=\s*"NO_INTERRUPTION"') { throw 'NO_INTERRUPTION still active' }
          if ($c -notmatch 'Tạo/Lấy API key') { throw 'Get API key button missing' }
          if ($c -notmatch 'Dán key') { throw 'Paste key button missing' }
          if ($c -notmatch 'Âm lượng gốc') { throw 'Original volume UI missing' }
          if ($c -notmatch 'SetBaseFactor') { throw 'Base volume implementation missing' }
          if ($c -notmatch 'generationConfig = new[\s\S]*inputAudioTranscription = new[\s\S]*translationConfig = new') { throw 'Strict 3.5 config missing' }
          Write-Host 'ALAD v4.1 patch verified.'

      - name: Restore
        run: dotnet restore alad-windows-v2/AladWindowsV2.csproj -r ${{ matrix.rid }}

      - name: Publish
        run: dotnet publish alad-windows-v2/AladWindowsV2.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -o out/${{ matrix.rid }}

      - name: Rename
        shell: pwsh
        run: |
          $exe = Get-ChildItem "out/${{ matrix.rid }}" -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw 'No EXE found' }
          Move-Item $exe.FullName "out/${{ matrix.rid }}/ALAD-Windows-v4.1-${{ matrix.rid }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: ALAD-Windows-v4.1-${{ matrix.rid }}
          path: out/${{ matrix.rid }}/ALAD-Windows-v4.1-${{ matrix.rid }}.exe
          if-no-files-found: error
