name: Build ListCalculatorFold2 v2.9.4 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-v294-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply v2.9.4 Fold wide + OCR + cash patch
        shell: bash
        env:
          PATCH_GZ_B64: ''
        run: |
          echo "$PATCH_GZ_B64" | base64 --decode | gzip --decompress > /tmp/v294.patch
          git apply --check /tmp/v294.patch
          git apply /tmp/v294.patch
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text()
          import re
          s=re.sub(r'versionCode\s+\d+','versionCode 294',s)
          s=re.sub(r"versionName\s+'[^']+'","versionName '2.9.4'",s)
          if "com.google.mlkit:text-recognition" not in s:
              s=s.replace("implementation 'androidx.recyclerview:recyclerview:1.4.0'","implementation 'androidx.recyclerview:recyclerview:1.4.0'\n    implementation 'com.google.mlkit:text-recognition:16.0.1'")
          p.write_text(s)
          PY
          grep -nE 'versionCode|versionName|text-recognition' app/build.gradle

      - name: Restore stable signing key
        shell: bash
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/listcalculator-update.jks"
          test -s "$RUNNER_TEMP/listcalculator-update.jks"

      - name: Build signed release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/listcalculator-update.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --stacktrace
          test -f app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk ListCalculatorFold2-v2.9.4-FoldWide-OCR-Cash.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ListCalculatorFold2-v2.9.4-FoldWide-OCR-Cash
          path: ListCalculatorFold2-v2.9.4-FoldWide-OCR-Cash.apk
          if-no-files-found: error
