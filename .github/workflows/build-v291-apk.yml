name: Build ListCalculatorFold2 v2.9.1 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-v291-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply v2.9.1 Fold6 + RedMagic 8 Pro patch
        shell: bash
        env:
          PATCH_GZ_B64: ''
        run: |
          echo "$PATCH_GZ_B64" | base64 --decode | gzip --decompress > /tmp/v291.patch
          git apply --check /tmp/v291.patch
          git apply /tmp/v291.patch
          sed -i -E 's/versionCode [0-9]+/versionCode 291/' app/build.gradle
          sed -i -E "s/versionName '[^']+'/versionName '2.9.1'/" app/build.gradle
          grep -nE 'versionCode|versionName' app/build.gradle
          grep -n 'NX729' app/src/main/java/com/vinh/listcalculatorfold2/MainActivity.java

      - name: Restore stable signing key
        shell: bash
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/listcalculator-update.jks"
          test -s "$RUNNER_TEMP/listcalculator-update.jks"

      - name: Build signed release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/listcalculator-update.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --stacktrace
          test -f app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk ListCalculatorFold2-v2.9.1-Fold6-RedMagic8Pro.apk
          ls -lh ListCalculatorFold2-v2.9.1-Fold6-RedMagic8Pro.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ListCalculatorFold2-v2.9.1-Fold6-RedMagic8Pro
          path: ListCalculatorFold2-v2.9.1-Fold6-RedMagic8Pro.apk
          if-no-files-found: error
