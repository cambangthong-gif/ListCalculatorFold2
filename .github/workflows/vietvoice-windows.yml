name: Build VietVoice Reader Windows

on:
  push:
    branches:
      - vietvoice-windows-v1
    paths:
      - 'windows/VietVoiceReader/**'
      - '.github/workflows/vietvoice-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-arm64, win-x64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore windows/VietVoiceReader/VietVoiceReader.csproj -r ${{ matrix.rid }}

      - name: Publish clean single-file app
        run: dotnet publish windows/VietVoiceReader/VietVoiceReader.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -p:PublishReadyToRun=false -o out/${{ matrix.rid }}

      - name: Build clean portable package
        shell: pwsh
        run: |
          $exe = "out/${{ matrix.rid }}/VietVoiceReader.exe"
          if (!(Test-Path $exe)) { throw "VietVoiceReader.exe missing" }

          New-Item -ItemType Directory -Force -Path package/${{ matrix.rid }} | Out-Null
          Copy-Item $exe package/${{ matrix.rid }}/VietVoiceReader.exe

          @"
VietVoice Reader
================
Chạy trực tiếp VietVoiceReader.exe.

Các thư viện .NET/Sherpa/NAudio đã được đóng gói trong EXE.
Model giọng tải về được lưu trong LocalAppData\VietVoiceReader,
không nằm cạnh file EXE.
"@ | Set-Content -Encoding UTF8 package/${{ matrix.rid }}/README.txt

          $rootFiles = Get-ChildItem package/${{ matrix.rid }} -File
          if (!(Test-Path "package/${{ matrix.rid }}/VietVoiceReader.exe")) {
            throw "Clean package EXE missing"
          }

          Write-Host "Clean package:"
          $rootFiles | Select-Object Name,Length | Format-Table

      - name: Zip portable app
        shell: pwsh
        run: Compress-Archive -Path "package/${{ matrix.rid }}/*" -DestinationPath "VietVoice-Reader-Windows-${{ matrix.rid }}.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: VietVoice-Reader-Windows-${{ matrix.rid }}
          path: VietVoice-Reader-Windows-${{ matrix.rid }}.zip
          retention-days: 14
